<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Switchyard</title>
  <desc id="desc">Cada robot, a su destino. Una flota, en sintonía. Marca con un símbolo de desvío y un plano de rutas sobre fondo oscuro.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#263642" stroke-width="1"/>
    </pattern>
    <linearGradient id="bg" x2="1" y2="1">
      <stop stop-color="#101820"/>
      <stop offset="1" stop-color="#192D37"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="400" rx="24" fill="url(#bg)"/>
  <rect x="740" y="24" width="436" height="352" rx="16" fill="url(#grid)"/>
  <g fill="none" stroke="#304550" stroke-width="24" stroke-linecap="round" stroke-linejoin="round">
    <path d="M800 80H1000V160H1120"/>
    <path d="M800 320H880V240H1040V320H1120"/>
  </g>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M800 80H1000V160H1120" stroke="#63E6BE" stroke-width="4"/>
    <path d="M800 320H880V240H1040V320H1120" stroke="#7CB8FF" stroke-width="4" stroke-dasharray="8 9"/>
    <path d="M920 80V160Q920 200 960 200H1080" stroke="#FFBF69" stroke-width="3" stroke-dasharray="4 8"/>
  </g>
  <g fill="#101820" stroke-width="4">
    <circle cx="800" cy="80" r="8" stroke="#63E6BE"/>
    <circle cx="1120" cy="160" r="8" stroke="#63E6BE"/>
    <circle cx="800" cy="320" r="8" stroke="#7CB8FF"/>
    <circle cx="1120" cy="320" r="8" stroke="#7CB8FF"/>
  </g>
  <g transform="translate(982 62)">
    <rect width="36" height="36" rx="10" fill="#63E6BE"/>
    <rect x="8" y="10" width="20" height="13" rx="4" fill="#101820"/>
    <circle cx="13" cy="16" r="2" fill="#63E6BE"/>
    <circle cx="23" cy="16" r="2" fill="#63E6BE"/>
  </g>
  <g transform="translate(56 48)">
    <rect width="68" height="68" rx="18" fill="#63E6BE"/>
    <path d="M22 48V22M22 40L46 22" fill="none" stroke="#101820" stroke-width="5" stroke-linecap="round"/>
    <g fill="#101820"><circle cx="22" cy="48" r="5"/><circle cx="22" cy="20" r="5"/><circle cx="48" cy="20" r="5"/></g>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="144" y="76" fill="#63E6BE" font-size="14" font-weight="700" letter-spacing="3">COORDINACIÓN DISTRIBUIDA</text>
    <text x="144" y="102" fill="#C1CDD6" font-size="16">Robots autónomos · Almacén simulado</text>
    <text x="52" y="215" fill="#F4F7FB" font-size="82" font-weight="750" letter-spacing="-3">Switchyard</text>
    <text x="58" y="270" fill="#F4F7FB" font-size="25">Cada robot, a su destino.</text>
    <text x="58" y="306" fill="#C1CDD6" font-size="25">Una flota, en sintonía.</text>
    <text x="58" y="365" fill="#63E6BE" font-size="12" font-weight="700" letter-spacing="2">CONECTAR / COORDINAR / MOVER</text>
  </g>
