name: .NET

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore Switchyard.sln
      - name: Build
        run: dotnet build Switchyard.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test Switchyard.sln --configuration Release --no-build
      - name: Check formatting
        run: dotnet format Switchyard.sln --verify-no-changes --no-restore
      - name: Set up Node for browser checks
        if: runner.os == 'Linux'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Install browser test dependencies
        if: runner.os == 'Linux'
        run: npm ci --prefix tests/browser
      - name: Install Chromium
        if: runner.os == 'Linux'
        working-directory: tests/browser
        run: npx playwright install --with-deps chromium
      - name: Test the warehouse editor in Chromium
        if: runner.os == 'Linux'
        run: npm test --prefix tests/browser
